  search:
    location: navbar
    type: overlay
    show-item-context: true
  page-navigation: true
  back-to-top-navigation: true
  bread-crumbs: true

  navbar:
    background: primary
    left:
      - href: index.md
        text: Home
      - text: Guide
        menu:
          - href: guide/route-overview.md
